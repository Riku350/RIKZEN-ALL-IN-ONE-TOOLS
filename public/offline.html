<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — RIKZEN All-in-One Tools</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0c0e;
        color: #fafaf8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 22px;
        padding: 32px;
        background: #14161a;
        text-align: center;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #a1a1aa; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #d4af37;
        color: #0b0c0e;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>Server-side file processing tools require an active connection. Reconnect to process files with RIKZEN.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
